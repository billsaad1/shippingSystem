version: 1.0.{build}
image: Visual Studio 2022
clone_depth: 1
build: off

install:
  - ps: |
      $flutterRoot = 'C:\flutter'
      if (-not (Test-Path $flutterRoot)) {
        git clone --depth 1 --branch stable https://github.com/flutter/flutter.git $flutterRoot
        if ($LASTEXITCODE -ne 0) { throw 'Failed to install Flutter SDK.' }
      }
      Add-AppveyorPath "$flutterRoot\bin"
      $env:Path = "$flutterRoot\bin;$env:Path"
      flutter --version
      flutter config --enable-windows-desktop
      choco install innosetup --yes --no-progress
      if ($LASTEXITCODE -ne 0) { throw 'Failed to install Inno Setup.' }

build_script:
  - cmd: flutter pub get
  - cmd: flutter analyze
  - cmd: flutter test --reporter expanded
  - cmd: flutter build windows --release
  - ps: |
      $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
      if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
      & $compiler "installer\ShippingSystem.iss"
      if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }

artifacts:
  - path: dist\ShippingSystem-Setup.exe
    name: ShippingSystem-Setup
