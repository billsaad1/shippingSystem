version: 1.0.{build}
image: Visual Studio 2022
clone_depth: 1
build: off

install:
  - ps: |
      $flutterRoot = 'C:\flutter'
      if (-not (Test-Path $flutterRoot)) {
        git clone --depth 1 --branch stable https://github.com/flutter/flutter.git $flutterRoot
        if ($LASTEXITCODE -ne 0) { throw 'Failed to install Flutter SDK.' }
      }
      $env:Path = "$flutterRoot\bin;$env:Path"
      flutter --version
      flutter config --enable-windows-desktop
      choco install innosetup --yes --no-progress
      if ($LASTEXITCODE -ne 0) { throw 'Failed to install Inno Setup.' }

build_script:
  - ps: |
      $env:Path = 'C:\flutter\bin;' + $env:Path
      flutter pub get
      if ($LASTEXITCODE -ne 0) { throw 'flutter pub get failed.' }
      flutter analyze
      if ($LASTEXITCODE -ne 0) { throw 'flutter analyze failed.' }
      flutter test --reporter expanded
      if ($LASTEXITCODE -ne 0) { throw 'flutter test failed.' }
      flutter build windows --release
      if ($LASTEXITCODE -ne 0) { throw 'flutter build windows failed.' }
      $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
      if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
      & $compiler "installer\ShippingSystem.iss"
      if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }

artifacts:
  - path: dist\ShippingSystem-Setup.exe
    name: ShippingSystem-Setup
