name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and package Windows app
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Create Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler"
          }
          & $compiler "installer\ShippingSystem.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShippingSystem-Windows-Setup
          path: dist/ShippingSystem-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Shipping System v1.1.0
          target_commitish: ${{ github.sha }}
          body: |
            Windows desktop installer for the shipping documents and customer accounts application.

            Download `ShippingSystem-Setup.exe` and run it. The installer offers an optional desktop shortcut.
          files: dist/ShippingSystem-Setup.exe
          overwrite_files: true
          make_latest: true
